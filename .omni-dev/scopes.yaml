scopes:
  - name: "ci"
    description: "CI/CD pipelines and GitHub Actions workflows"
    examples: ["ci: add commit validation workflow", "ci: fix release pipeline"]
    file_patterns: [".github/**"]
  - name: "cli"
    description: "Command-line interface and argument parsing"
    examples: ["cli: add gmail search flags", "cli: improve help text"]
    file_patterns: ["src/cli.rs", "src/cli/**", "src/main.rs"]
  - name: "docs"
    description: "Documentation, ADRs and guides"
    examples: ["docs: add shared-infrastructure ADR", "docs: fix quickstart link"]
    file_patterns: ["docs/**", "README.md", "CONTRIBUTING.md", "AGENTS.md", "CLAUDE.md"]
  - name: "changelog"
    description: "Changelog entries"
    examples: ["changelog: note the new drive command"]
    file_patterns: ["CHANGELOG.md", "changelog.d/**", "scripts/changelog.py", "scripts/test_changelog.py"]
  - name: "release"
    description: "Release preparation: version bump and assembled changelog"
    examples: ["chore(release): prepare v0.1.0"]
    file_patterns: ["CHANGELOG.md", "changelog.d/**", "Cargo.toml", "Cargo.lock"]
  - name: "gmail"
    description: "Gmail client, engines and CLI surface"
    examples: ["gmail: add label filter", "gmail: fix thread pagination"]
    file_patterns: ["src/gmail.rs", "src/gmail/**", "src/cli/gmail.rs", "src/cli/gmail/**"]
  - name: "drive"
    description: "Drive, Docs, Sheets and Slides clients and CLI surface"
    examples: ["drive: add trash command", "drive: tighten write gate"]
    file_patterns: ["src/drive.rs", "src/drive/**", "src/cli/drive.rs", "src/cli/drive/**"]
  - name: "mcp"
    description: "MCP server and tools"
    examples: ["mcp: register gmail tools"]
    file_patterns: ["src/mcp.rs", "src/mcp/**", "src/mcp_server.rs"]
  - name: "log"
    description: "Local invocation and HTTP request log (log.jsonl) and the gwi log command"
    examples: ["log: redact more URL parameters", "log: fix follow on rotation"]
    file_patterns: ["src/request_log.rs", "src/cli/log.rs", "src/cli/log/**"]
  - name: "utils"
    description: "Shared utilities: HTTP, settings, secrets, paths, rate limiting"
    examples: ["utils: tighten secret file permissions", "utils: fix rate limiter window"]
    file_patterns: ["src/utils.rs", "src/utils/**"]
  - name: "workflows"
    description: "GitHub Actions workflow files"
    examples: ["workflows: add release workflow"]
    file_patterns: [".github/workflows/**"]
  - name: "test"
    description: "Integration tests, shared test helpers, fixtures and snapshots"
    examples: ["test(test): add CLI regression coverage"]
    file_patterns: ["tests/**", "src/test_support.rs"]
  - name: "scripts"
    description: "Development scripts, sandbox tooling and validation helpers"
    examples: ["chore(scripts): improve sandbox test runner"]
    file_patterns: ["scripts/**"]

# Paths that legitimately belong to no scope.
allow:
  - "src/lib.rs" # Crate-wide module registration and exports span subsystem owners.
  - "LICENSE" # Repository-wide licensing terms have no subsystem owner.
  - "CODE_OF_CONDUCT.md" # Community conduct policy applies to the whole project.
  - "clippy.toml" # Shared Rust lint thresholds apply across all subsystems.
  - "rustfmt.toml" # Shared Rust formatting rules apply across all subsystems.
  - "deny.toml" # Dependency security, license and source policy applies crate-wide.
  - ".gitignore" # Repository-wide exclusions cover build, editor and local artifacts.
