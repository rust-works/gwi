name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Merge queue entries. The queue builds a `gh-readonly-queue/main/...` branch and waits
  # for every required context on it; without this trigger none report and the entry times
  # out and is ejected. Branch filters are not supported on this event.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not hide whether the others are healthy.
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --verbose
    # The `mcp` feature adds the `gwi-mcp` server and its tests. It is a second step, not a
    # matrix leg, so the required `Test (stable)` and `Test (nightly)` contexts keep their names.
    - run: cargo test --features mcp --verbose

  # The suite with the external network and the browser opener unavailable (#22). Not a
  # required context; see "Running the tests in a sandbox" in CONTRIBUTING.md.
  sandboxed-test:
    name: Sandboxed Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # The script needs an unprivileged user namespace (`unshare -rn`), which the runner's
    # AppArmor profile restricts by default since Ubuntu 23.10. The key is absent on an image
    # without that restriction, which then needs nothing.
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - run: scripts/sandbox-test.sh

  # Required by the main merge queue ruleset (#179). Keep this exact context name
  # and run it on both pull_request and merge_group events.
  home-write-test:
    name: Empty HOME Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: python3 scripts/test_home_write_test.py -v
    - run: python3 scripts/home-write-test.py

  # Required by the main merge queue ruleset (#225). Keep this exact context name
  # and run it on both pull_request and merge_group events.
  hostile-env-test:
    name: Hostile Environment Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: python3 scripts/test_hostile_env_test.py -v
    - run: python3 scripts/hostile-env-test.py

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release --features mcp
    # Run the tests and doctests, so Windows runtime failures turn CI red (#117).
    # Two steps, as in `Test`, to cover both feature sets; see "Tests on Windows"
    # in CONTRIBUTING.md for the narrowly gated Unix-only fixtures.
    - run: cargo test --verbose
    - run: cargo test --features mcp --verbose

  # Attribute debug builder frames and sweep actual thread budgets on Windows.
  # Baseline and candidate share dependency artifacts, but compile their own source.
  windows-cli-stack:
    name: Windows CLI Stack
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Prepare baseline with the same probe
      shell: pwsh
      env:
        STACK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      run: |
        $baseline = "$HOME/wrk/work-trees/gwi/stack-before"
        git worktree add --detach $baseline $env:STACK_BASE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item tests/cli_stack_test.rs "$baseline/tests/cli_stack_test.rs"
        # Older bases do not declare this new test target (autotests is false).
        if (-not (Select-String -Path "$baseline/Cargo.toml" -Pattern 'name = "cli_stack_test"' -Quiet)) {
          Add-Content "$baseline/Cargo.toml" "`n[[test]]`nname = `"cli_stack_test`"`npath = `"tests/cli_stack_test.rs`""
        }
    - name: Measure baseline and candidate with both feature sets
      shell: pwsh
      run: |
        python scripts/test_measure_cli_stack.py -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        foreach ($phase in @("before", "after")) {
          $checkout = if ($phase -eq "before") { "$HOME/wrk/work-trees/gwi/stack-before" } else { "$env:GITHUB_WORKSPACE" }
          foreach ($features in @("default", "mcp")) {
            $arguments = @("scripts/measure_cli_stack.py", "--checkout", $checkout, "--output", "$env:RUNNER_TEMP/cli-stack/$phase-$features")
            if ($features -eq "mcp") { $arguments += "--mcp" }
            python @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: windows-cli-stack
        path: |
          ${{ runner.temp }}/cli-stack/*/report.json
          ${{ runner.temp }}/cli-stack/*/compile.jsonl
          ${{ runner.temp }}/cli-stack/*/probe-*.log

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --all-targets --features mcp -- -D warnings

  # Separate job preserves the required Linux `Clippy` context. This new context
  # is non-required; requiring it is a separate repository-ruleset decision (#200).
  windows-clippy:
    name: Windows Clippy
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --all-targets --features mcp -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # Matches omni-dev's docs job, but denies every rustdoc warning (private intra-doc links,
    # redundant explicit links, bare `<ID>` read as an HTML tag) so doc bugs fail here rather
    # than accumulating.
    - run: cargo doc --no-deps --document-private-items --features mcp
      env:
        RUSTDOCFLAGS: -D warnings
    # The public build (what docs.rs renders) must be clean too, not just the private-items one.
    - run: cargo doc --no-deps --features mcp
      env:
        RUSTDOCFLAGS: -D warnings

  # Dead relative links, dead anchors and dead ADR names in docs and doc comments (#52). Not
  # `cargo doc`'s job: it does not read markdown, and rustdoc links are not checked for files.
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Keep the root-skip guard in this required context (#113).
    - run: python3 scripts/test_check_permission_tests.py -v
    - run: python3 scripts/check_permission_tests.py
    - run: python3 scripts/test_check_doc_links.py -v
    - run: python3 scripts/check_doc_links.py

  coverage:
    name: Coverage
    # Skip on tag pushes: coverage is meaningful on PRs (diff comment) and main pushes
    # (baseline publish); a tag has no PR and its commit was already validated on main.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # required to post the coverage comment
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # full history so `git merge-base` can resolve the PR's fork point
    # The coverage pipeline (cargo-llvm-cov run, merge-base baseline, `patchcov diff` sticky PR
    # comment, summary + artifacts, baseline publish on main) is packaged in
    # action-works/patchcov-action, as in omni-dev.
    - uses: action-works/patchcov-action@v1.0

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
