name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Merge queue entries. The queue builds a `gh-readonly-queue/main/...` branch and waits
  # for every required context on it; without this trigger none report and the entry times
  # out and is ejected. Branch filters are not supported on this event.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      # One flaky leg must not hide whether the others are healthy.
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --verbose
    # The `mcp` feature adds the `gwi-mcp` server and its tests. It is a second step, not a
    # matrix leg, so the required `Test (stable)` and `Test (nightly)` contexts keep their names.
    - run: cargo test --features mcp --verbose

  # The suite with the external network and the browser opener unavailable (#22). Not a
  # required context; see "Running the tests in a sandbox" in CONTRIBUTING.md.
  sandboxed-test:
    name: Sandboxed Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: scripts/sandbox-test.sh

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release --features mcp

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo clippy --all-targets --features mcp -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # Matches omni-dev's docs job, but denies every rustdoc warning (private intra-doc links,
    # redundant explicit links, bare `<ID>` read as an HTML tag) so doc bugs fail here rather
    # than accumulating.
    - run: cargo doc --no-deps --document-private-items --features mcp
      env:
        RUSTDOCFLAGS: -D warnings
    # The public build (what docs.rs renders) must be clean too, not just the private-items one.
    - run: cargo doc --no-deps --features mcp
      env:
        RUSTDOCFLAGS: -D warnings

  coverage:
    name: Coverage
    # Skip on tag pushes: coverage is meaningful on PRs (diff comment) and main pushes
    # (baseline publish); a tag has no PR and its commit was already validated on main.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write        # required to post the coverage comment
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # full history so `git merge-base` can resolve the PR's fork point
    # The coverage pipeline (cargo-llvm-cov run, merge-base baseline, `patchcov diff` sticky PR
    # comment, summary + artifacts, baseline publish on main) is packaged in
    # action-works/patchcov-action, as in omni-dev.
    - uses: action-works/patchcov-action@v1.0

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
