name: Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Deterministic, no-AI validation (#1472), replacing the AI-powered
      # `command: check` invocation this workflow used to run: across 40
      # runs it caught zero commit-message defects and produced one false
      # positive (an Anthropic billing outage), while re-judging messages an
      # AI had already written against the same guidelines. `command: lint`
      # (v1.4+) runs `omni-dev git commit message lint` instead — no API
      # key, no network call beyond fetching the omni-dev binary itself.
      - uses: action-works/omni-dev-commit-check@v1.4
        with:
          command: lint
          strict: true
      # `.omni-dev/scopes.yaml` can drift from the tree without any commit message being
      # wrong: this fails on a tracked file under a root that no scope or `allow:` entry
      # covers, and on a `file_patterns` entry that matches nothing (#50). It reuses the
      # omni-dev binary the step above installed onto PATH (the action installs it even
      # on `main`, where it skips the commit lint), so there is no second install and no
      # version skew with the commit lint in the same run.
      - name: Lint scopes.yaml against the tree
        run: omni-dev config scopes lint --root src --root .github
